name: MiraNPC
version: 0.1.8
main: com.mira.npc.MiraNPCPlugin
api-version: '1.21'
authors: [FiveS]
description: Stable villager-only NPC editor, placement and interaction backend.
softdepend: [PlaceholderAPI, MiraFactions]
commands:
  mnpc:
    description: MiraNPC editor and villager placement commands
    usage: /mnpc
    permission: miranpc.admin
permissions:
  miranpc.admin:
    description: Access to all MiraNPC creation, editing and placement tools
    default: op
